name: Python CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - name: Checkout código
      uses: actions/checkout@v3
    
    - name: Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Executar testes com pytest
      run: |
        python -m pytest test_app.py -v
    
    - name: Verificar estilo de código (opcional)
      run: |
        pip install flake8
        flake8 app.py test_app.py --max-line-length=127

  deploy-demo:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Instalar dependências
      run: |
        pip install -r requirements.txt
    
    - name: Executar aplicação em background
      run: |
        nohup python app.py > flask.log 2>&1 &
        sleep 5
    
    - name: Testar endpoint da aplicação
      run: |
        curl -f http://localhost:5000/ || exit 1
        curl -f http://localhost:5000/api/health || exit 1
    
    - name: Log de sucesso
      run: |
        echo " Aplicação rodando com sucesso!"
        echo " Endpoints testados:"
        echo "   - http://localhost:5000/"
        echo "   - http://localhost:5000/api/health"
    
    - name: Upload de artefatos (logs)
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: flask-logs
        path: flask.log